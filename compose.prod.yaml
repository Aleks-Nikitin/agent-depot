# Single-VPS production stack for Vultr: app + PostgreSQL behind one Docker host.
# For Vultr Managed Databases, delete the `postgres` service and point
# DATABASE_URL at the managed cluster instead.
name: agent-depot-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_depot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: agent_depot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_depot -d agent_depot"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RUNTIME_API_TOKEN: ${RUNTIME_API_TOKEN}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      RUNTIME_MODEL_ID: ${RUNTIME_MODEL_ID:-gemini-3.1-flash-lite}
      RUNTIME_INPUT_USD_PER_MILLION: ${RUNTIME_INPUT_USD_PER_MILLION:-0.25}
      RUNTIME_OUTPUT_USD_PER_MILLION: ${RUNTIME_OUTPUT_USD_PER_MILLION:-1.50}
    ports:
      - "${APP_PORT:-80}:3000"

volumes:
  postgres_data:
